name: Setup Java

inputs:
  android-packages:
    description: 'Space-separated SDK packages for setup-android to install'
    required: false
    default: 'platform-tools'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        add-job-summary: 'on-failure'

    - name: Setup Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: ${{ inputs.android-packages }}
