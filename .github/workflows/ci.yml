name: Android CI

on:
  pull_request:
  push:
    branches:
      - '**'
    # Tags are ignored since the release workflow calls this workflow
    # directly.
    tags-ignore:
      - '**'
  # Allow this workflow to be called by other workflows.
  workflow_call:
  # Allow this workflow to be run manually.
  workflow_dispatch:
    inputs:
      device_override:
        description: 'Device to test'
        required: true
        default: 'all'
        type: choice
        options: [all, pixel2Api27, pixel2Api28, pixel2Api29, pixel2Api35]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-java

      - run: ./gradlew testDebugUnitTest

      - name: Upload Unit Test Coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: app/build/**/*.exec

  instrumentation:
    runs-on: ubuntu-latest
    # Room for two 15-minute test attempts, diagnostics capture, and setup.
    timeout-minutes: 45
    needs: unit
    # This job only runs if it's a PR, a manual trigger, or a call from another workflow
    if: >
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'workflow_call'
    strategy:
      fail-fast: false
      matrix:
        # If manual, use the selected device. If not manual or 'all', use the full list.
        # The list must match the managed devices defined in app/build.gradle.
        device: ${{ (github.event.inputs.device_override != 'all' && github.event.inputs.device_override != '') && fromJSON(format('["{0}"]', github.event.inputs.device_override)) || fromJSON('["pixel2Api27", "pixel2Api28", "pixel2Api29", "pixel2Api35"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-java
        with:
          # Install the emulator up front. setup-android <4.0.2 got it implicitly
          # as a dependency of the removed `tools` package, and AGP's managed
          # device setup fails on API 27/28 when it has to fetch it itself
          # ("Cannot query the value of this property because it has no value
          # available").
          android-packages: platform-tools emulator

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM is available and accessible."
          else
            echo "KVM is NOT available on this runner. Tests will be extremely slow."
            exit 1
          fi

      # We read the token during build to pass down to the tests so they can connect
      # to the simulator for fake phone calls. At the point we read it, the emulator
      # is not running and no auth token has been created. As a result we create one
      # before it can to pass to our tests.
      - name: Set emulator console auth token
        run: echo "ci-auth-token" > ~/.emulator_console_auth_token

      - name: Clean unused devices
        run: ./gradlew cleanManagedDevices --unusedOnly || true

      # Gradle downloads the system image on every run, and that download has
      # been seen to hang indefinitely (pixel2Api27, 2026-11-01). Restoring it
      # from cache skips the download entirely after the first good run.
      - name: Restore system image
        id: sysimg-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-images-${{ matrix.device }}-v1

      # Managed-device runs are occasionally flaky, and pixel2Api28 sometimes
      # hangs mid-run with no timeout ever firing. Each attempt runs under a
      # watchdog: on timeout it snapshots the device and host *before* killing
      # Gradle (killing Gradle shuts the emulator down), then retries once. A
      # pass on the second attempt is surfaced as a warning annotation.
      - name: Run test on ${{ matrix.device }}
        env:
          DEVICE: ${{ matrix.device }}
          ATTEMPT_TIMEOUT_SECONDS: 900
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          DIAG_DIR="$RUNNER_TEMP/diagnostics"
          mkdir -p "$DIAG_DIR"

          # Stream the full device logcat for the whole step. The per-test
          # logcats in the results are only written when a test finishes, so
          # they never contain the hang itself.
          (
            while true; do
              "$ADB" wait-for-device >/dev/null 2>&1 || true
              echo "===== logcat attached $(date -u +%FT%TZ)" >> "$DIAG_DIR/device-logcat.txt"
              "$ADB" logcat -v threadtime >> "$DIAG_DIR/device-logcat.txt" 2>&1 || true
              sleep 2
            done
          ) &
          LOGCAT_LOOP_PID=$!
          trap 'pkill -P "$LOGCAT_LOOP_PID" 2>/dev/null || true; kill "$LOGCAT_LOOP_PID" 2>/dev/null || true' EXIT

          capture_diagnostics() {
            local d="$DIAG_DIR/attempt-$1"
            mkdir -p "$d"
            echo "Capturing diagnostics to $d"

            # Host side: is the emulator spinning or idle, what are Gradle/UTP doing?
            uptime > "$d/host-uptime.txt" 2>&1 || true
            ps -eo pid,ppid,stat,pcpu,pmem,etime,args --sort=-pcpu > "$d/host-ps.txt" 2>&1 || true
            for pid in $(pgrep -f java || true); do
              timeout 30 jstack "$pid" > "$d/host-jstack-$pid.txt" 2>&1 || true
            done
            timeout 15 "$ADB" devices -l > "$d/adb-devices.txt" 2>&1 || true

            # Guest side. If adb can't even run `true`, the emulator itself is
            # wedged rather than something inside Android.
            if ! timeout 20 "$ADB" shell true > /dev/null 2>&1; then
              echo "adb shell unresponsive at $(date -u +%FT%TZ)" > "$d/adb-shell-UNRESPONSIVE.txt"
              return 0
            fi
            timeout 30 "$ADB" exec-out screencap -p > "$d/screen.png" 2>/dev/null || true
            timeout 60 "$ADB" shell ps -A -o PID,PPID,S,WCHAN,TIME,NAME > "$d/guest-ps.txt" 2>&1 || true
            timeout 60 "$ADB" shell dumpsys activity activities > "$d/dumpsys-activities.txt" 2>&1 || true
            timeout 60 "$ADB" shell dumpsys activity processes > "$d/dumpsys-processes.txt" 2>&1 || true
            timeout 60 "$ADB" shell dumpsys window windows > "$d/dumpsys-windows.txt" 2>&1 || true
            timeout 60 "$ADB" logcat -d -b events -b crash -v threadtime > "$d/logcat-events-crash.txt" 2>&1 || true

            # Java stack dumps of the app/instrumentation and orchestrator
            # processes show exactly where they are stuck. AOSP images are
            # userdebug, so su is available for kill -3 and reading /data/anr.
            for proc in com.novyr.callfilter androidx.test.orchestrator; do
              for gpid in $(timeout 15 "$ADB" shell pidof "$proc" 2>/dev/null | tr -d '\r'); do
                timeout 15 "$ADB" shell su 0 kill -3 "$gpid" > /dev/null 2>&1 || true
              done
            done
            sleep 5
            timeout 60 "$ADB" shell "su 0 sh -c 'ls -l /data/anr; for f in /data/anr/*; do echo \"===== \$f\"; cat \"\$f\"; done'" \
              > "$d/guest-anr-traces.txt" 2>&1 || true
          }

          run_tests() {
            ./gradlew ":app:${DEVICE}DebugAndroidTest" \
              -PtestMinSdk=26 \
              -Pandroid.testInstrumentationRunnerArguments.useTestStorageService=true \
              -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
              -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=15 \
              -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 &
            local gradle_pid=$!
            local waited=0
            while kill -0 "$gradle_pid" 2>/dev/null; do
              if [ "$waited" -ge "$ATTEMPT_TIMEOUT_SECONDS" ]; then
                echo "::warning title=Instrumentation attempt timed out::${DEVICE} attempt $1 did not finish within ${ATTEMPT_TIMEOUT_SECONDS}s; see the diagnostics-${DEVICE} artifact"
                capture_diagnostics "$1"
                kill -TERM "$gradle_pid" 2>/dev/null || true
                sleep 30
                kill -KILL "$gradle_pid" 2>/dev/null || true
                wait "$gradle_pid" 2>/dev/null || true
                return 124
              fi
              sleep 10
              waited=$((waited + 10))
            done
            wait "$gradle_pid"
          }

          for attempt in 1 2; do
            echo "===== attempt ${attempt} starting $(date -u +%FT%TZ)" >> "$DIAG_DIR/device-logcat.txt"
            if run_tests "$attempt"; then
              if [ "$attempt" -gt 1 ]; then
                echo "::warning title=Flaky instrumentation run::${DEVICE} passed only on attempt ${attempt}"
              fi
              exit 0
            fi
            echo "::warning title=Instrumentation attempt failed::${DEVICE} attempt ${attempt} failed or timed out"

            # Tear down whatever a failed or killed attempt left behind so the
            # retry gets a fresh emulator.
            ./gradlew --stop || true
            pkill -9 -f qemu-system || true
            "$ADB" kill-server || true
            find ~/.android/avd/gradle-managed -name '*.lock' -prune -exec rm -rf {} + 2>/dev/null || true
          done
          exit 1

      # Only cache an image that finished installing; a hung or partial
      # download must not poison the cache.
      - name: Check system image is complete
        id: sysimg-check
        if: always() && steps.sysimg-restore.outputs.cache-hit != 'true'
        run: |
          if find "$ANDROID_HOME/system-images" -name source.properties 2>/dev/null | grep -q .; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save system image
        if: always() && steps.sysimg-check.outputs.complete == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-images-${{ matrix.device }}-v1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.device }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore

      - name: Upload Instrumentation Coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.device }}
          path: "**/build/**/*.ec"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.device }}
          path: app/build/test-results/managedDevice/

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit, instrumentation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-java

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-data/

      # We need to compile the debug classes so JaCoCo has something to analyze against
      - name: Compile Debug Classes
        run: ./gradlew compileDebugJavaWithJavac

      - name: Generate Unified JaCoCo Report
        run: ./gradlew generateUnifiedCoverageReport

      - name: Upload Full HTML Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-coverage-report-html
          path: app/build/reports/jacoco/generateUnifiedCoverageReport/html/

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install libxml2-utils

      - name: Generate Job Summary
        run: |
          REPORT_PATH="app/build/reports/jacoco/generateUnifiedCoverageReport/generateUnifiedCoverageReport.xml"

          MISSED=$(xmllint --xpath 'string(/report/counter[@type="INSTRUCTION"]/@missed)' "$REPORT_PATH")
          COVERED=$(xmllint --xpath 'string(/report/counter[@type="INSTRUCTION"]/@covered)' "$REPORT_PATH")

          MISSED=${MISSED:-0}
          COVERED=${COVERED:-0}

          TOTAL=$((MISSED + COVERED))

          if [ "$TOTAL" -gt 0 ]; then
            PERCENTAGE=$(echo "scale=2; ($COVERED * 100) / $TOTAL" | bc)
          else
            PERCENTAGE="0"
          fi

          # Write to the GitHub Summary
          {
            echo "## Code Coverage Report"
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| **Total Instructions** | $TOTAL |"
            echo "| **Covered** | $COVERED |"
            echo "| **Missed** | $MISSED |"
            echo "| **Percentage** | **$PERCENTAGE%** |"
          } >> $GITHUB_STEP_SUMMARY
